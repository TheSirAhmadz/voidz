# Voidz self-hosted stack: PostgreSQL + Console + Worker (+ optional edge proxy).
# Lucity: don't use this file — see docs/DEPLOYMENT.md "Deploying on Lucity"
# (one project: console service with public domain, worker internal-only,
# one-click PostgreSQL).
#
# Self-hosted with real per-instance hostnames: uncomment the caddy service,
# point *.voidz.example.com wildcard DNS at this host and set VOIDZ_DOMAIN_ROOT.
name: voidz

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voidz
      POSTGRES_PASSWORD: ${VOIDZ_PG_PASSWORD:?set VOIDZ_PG_PASSWORD}
      POSTGRES_DB: voidz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voidz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  console:
    build:
      context: ..
      dockerfile: deploy/docker/console.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VOIDZ_DATABASE_URL: postgres://voidz:${VOIDZ_PG_PASSWORD}@postgres:5432/voidz
      VOIDZ_SECRET_KEY: ${VOIDZ_SECRET_KEY:?set VOIDZ_SECRET_KEY (32+ chars)}
      VOIDZ_WORKER_TOKEN: ${VOIDZ_WORKER_TOKEN:?set VOIDZ_WORKER_TOKEN}
      VOIDZ_PUBLIC_URL: ${VOIDZ_PUBLIC_URL:-http://127.0.0.1:8080}
      VOIDZ_GITHUB_CLIENT_ID: ${VOIDZ_GITHUB_CLIENT_ID:-}
      VOIDZ_GITHUB_CLIENT_SECRET: ${VOIDZ_GITHUB_CLIENT_SECRET:-}
      VOIDZ_ADMIN_GITHUB_LOGIN: ${VOIDZ_ADMIN_GITHUB_LOGIN:-}
      VOIDZ_COOKIE_SECURE: ${VOIDZ_COOKIE_SECURE:-0}
      VOIDZ_LOCAL_WORKER_URL: http://worker:9100
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/docker/worker.Dockerfile
    depends_on:
      - console
    environment:
      VOIDZ_WORKER_TOKEN: ${VOIDZ_WORKER_TOKEN}
      VOIDZ_CONSOLE_URL: http://console:8080
      VOIDZ_NODE_ID: local
      VOIDZ_NODE_REGION: local
      VOIDZ_WORKER_DRIVER: ${VOIDZ_WORKER_DRIVER:-process}
      VOIDZ_WORKER_DATA: /var/lib/voidz/instances
    volumes:
      - workerdata:/var/lib/voidz/instances
      # Docker driver only — never expose this to Voidz Core containers:
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # Optional edge proxy: gives every instance a real hostname
  # <slug>-<token>.<VOIDZ_DOMAIN_ROOT> with automatic TLS (Let's Encrypt).
  # Requires wildcard DNS *.VOIDZ_DOMAIN_ROOT -> this host, ports 80/443.
  # caddy:
  #   image: caddy:2-alpine
  #   depends_on: [console]
  #   ports: ["80:80", "443:443"]
  #   environment:
  #     VOIDZ_DOMAIN_ROOT: ${VOIDZ_DOMAIN_ROOT:-}
  #     VOIDZ_CONSOLE_UPSTREAM: console:8080
  #   volumes:
  #     - ./proxy/Caddyfile.template:/etc/caddy/Caddyfile.template:ro
  #     - caddydata:/data
  #   command: sh -c "envsubst < /etc/caddy/Caddyfile.template > /etc/caddy/Caddyfile && caddy run --config /etc/caddy/Caddyfile"

volumes:
  pgdata:
  workerdata:
  caddydata:
